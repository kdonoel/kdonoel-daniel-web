<div class="container" id="login">
	<div class="card auth-card shadow-sm mx-auto">
		<div class="card-body p-4 p-sm-5">
			<div class="text-center mb-4">
				<i class="bi bi-gift fs-1 text-primary" aria-hidden="true"></i>
				<h1 class="h4 mt-2 mb-1">{{ 'login.title' | translate }}</h1>
				<p class="text-body-secondary mb-0">{{ 'login.description' | translate }}</p>
			</div>
			@if (sessionExpired) {
				<al-disclaimer label="login.sessionExpired" type="warn"></al-disclaimer>
			}
			@if (error) {
				<al-disclaimer [label]="error" type="error"></al-disclaimer>
			}
			<form novalidate [formGroup]="loginForm" (ngSubmit)="submit()" #formRef="ngForm">
				<div class="form-group mb-3" [n9ShowErrors]="formRef">
					<label for="email" class="form-label fw-semibold">{{ 'login.email' | translate }}</label>
					<input type="email" name="email" id="email" class="form-control" formControlName="email" autocomplete="username" inputmode="email" />
				</div>
				<div class="form-group mb-2" [n9ShowErrors]="formRef">
					<label for="password" class="form-label fw-semibold">{{ 'login.password' | translate }}</label>
					<input [type]="showPassword ? 'text' : 'password'" name="password" id="password" class="form-control" formControlName="password" autocomplete="current-password" />
				</div>
				<div class="form-check mb-4">
					<input class="form-check-input" type="checkbox" id="show-password" [checked]="showPassword" (change)="showPassword = !showPassword" />
					<label class="form-check-label" for="show-password">{{ 'commons.showPassword' | translate }}</label>
				</div>
				<button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loading">
					@if (loading) {
						<span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
					}
					{{ 'login.submit' | translate }}
				</button>
			</form>
			<p class="text-center mt-4 mb-0">
				<a routerLink="/password/init" [queryParams]="initPasswordQueryParams" [state]="{ email: loginForm.value.email }">{{ 'login.firstLogin' | translate }}</a>
			</p>
		</div>
	</div>
</div>
