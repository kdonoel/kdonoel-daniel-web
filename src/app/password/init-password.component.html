<div class="container" id="reset">
	<div class="card auth-card shadow-sm mx-auto">
		<div class="card-body p-4 p-sm-5">
			<div class="text-center mb-4">
				<i class="bi bi-key fs-1 text-primary" aria-hidden="true"></i>
				<h1 class="h4 mt-2 mb-1">{{ 'login.form.initPassword.label' | translate }}</h1>
				<p class="text-body-secondary mb-0">{{ 'password.signup.title' | translate }}</p>
			</div>
			<form (ngSubmit)="onSubmit()" [formGroup]="resetForm">
				<div class="form-group mb-3" n9ShowErrors>
					<label for="email" class="form-label">{{ 'password.signup.form.placeholders.email' | translate }}</label>
					<input type="email" name="email" id="email" class="form-control" formControlName="email" autocomplete="username" />
				</div>
				<div class="form-group mb-3" n9ShowErrors>
					<label for="pwd" class="form-label">{{ 'password.signup.form.placeholders.pwd' | translate }}</label>
					<input type="password" name="pwd" id="pwd" class="form-control" formControlName="pwd" autocomplete="new-password" />
				</div>
				<div class="form-group mb-3" n9ShowErrors>
					<label for="confirmedPwd" class="form-label">{{ 'password.signup.form.placeholders.confirmed-pwd' | translate }}</label>
					<input type="password" name="confirmedPwd" id="confirmedPwd" class="form-control" formControlName="confirmedPwd" autocomplete="new-password" />
				</div>
				@if (!resetForm.valid && resetForm.hasError('notEquivalent')) {
					<div class="small text-danger-emphasis mb-3">La confirmation du nouveau mot de passe ne correspond pas au nouveau mot de passe.</div>
				}
				<button type="submit" class="btn btn-primary w-100 mt-1" [disabled]="resetForm.invalid">
					{{ 'password.signup.form.actions.submit' | translate }}
				</button>
			</form>
		</div>
	</div>
</div>
