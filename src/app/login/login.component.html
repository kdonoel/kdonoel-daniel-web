<div class="container" id="login">
	<div class="card auth-card shadow-sm mx-auto">
		<div class="card-body p-4 p-sm-5">
			<div class="text-center mb-4">
				<i class="bi bi-gift fs-1 text-primary" aria-hidden="true"></i>
				<h1 class="h4 mt-2 mb-1">{{ 'login.form.title' | translate }}</h1>
				<p class="text-body-secondary mb-0">{{ 'login.title' | translate }}</p>
			</div>
			@if (!loading) {
				<form novalidate [formGroup]="loginForm" (ngSubmit)="submit($event)">
					@for (error of errors; track error) {
						<al-disclaimer [label]="error" type="blocker"></al-disclaimer>
					}
					<div class="form-group mb-3" n9ShowErrors>
						<label for="email" class="form-label">{{ 'login.form.placeholders.email' | translate }}</label>
						<input type="email" name="email" id="email" class="form-control" formControlName="email" autocomplete="username" #input />
					</div>
					<div class="form-group mb-4" n9ShowErrors>
						<label for="password" class="form-label">{{ 'login.form.placeholders.password' | translate }}</label>
						<input type="password" name="password" id="password" class="form-control" formControlName="password" autocomplete="current-password" #input />
					</div>
					<button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
						{{ 'login.form.actions.submit' | translate }}
					</button>
				</form>
			} @else {
				<al-loading></al-loading>
			}
		</div>
	</div>
</div>
