<div class="modal-header">
	<h2 class="modal-title h5">
		{{ 'kdo.' + modalType + '.title' | translate }}
	</h2>
	<button type="button" class="btn-close" aria-label="Fermer" (click)="close()"></button>
</div>
@if (!loading) {
	<form [formGroup]="form" (submit)="onSubmit()">
		<div class="modal-body">
			<div class="mb-3">
				<label for="title" class="form-label">{{ 'kdo.form.title' | translate }}</label>
				<input type="text" class="form-control" id="title" [placeholder]="'kdo.form.title' | translate" formControlName="title" />
			</div>
			<div class="mb-3">
				<label for="description" class="form-label">{{ 'kdo.form.description' | translate }}</label>
				<textarea class="form-control" id="description" rows="5" [placeholder]="'kdo.form.description' | translate" formControlName="description"></textarea>
			</div>
			@if (form.controls.isSurprise) {
				<div class="form-check form-switch">
					<input class="form-check-input" type="checkbox" role="switch" id="isSurprise" formControlName="isSurprise" />
					<label class="form-check-label" for="isSurprise">Est-ce une surprise ?</label>
				</div>
			}
		</div>
		<div class="modal-footer">
			<button type="button" class="btn btn-outline-secondary" (click)="close()">Annuler</button>
			<button type="submit" class="btn btn-primary" [disabled]="form.invalid">
				{{ 'kdo.form.submit.' + modalType | translate }}
			</button>
		</div>
	</form>
}
