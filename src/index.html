<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title>Kdos Noël</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a1430" />
		<link rel="icon" type="image/png" href="assets/favicon.png" sizes="96x96" />
		<script async src="https://www.googletagmanager.com/gtag/js?id=UA-109228987-1"></script>
		<script type="text/javascript">
			window.dataLayer = window.dataLayer || [];

			function gtag() {
				dataLayer.push(arguments);
			}

			gtag('js', new Date());

			gtag('config', 'UA-109228987-1');
		</script>
		<script type="text/javascript">
			// Apply the color mode before the app starts to avoid a flash, same rule as ThemeSwitchComponent
			(function () {
				var theme = localStorage.getItem('theme');
				if (theme !== 'light' && theme !== 'dark') {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-bs-theme', theme);
			})();
		</script>
		<style>
			/* Colors of the page until the styles are loaded, from _theme.scss and _variables.scss ($night-950,
			$body-color-dark). :where() keeps them less specific than the styles, which replace them once loaded. */
			body {
				background-color: #f2f4f9;
				color: #212529;
			}

			:where([data-bs-theme='dark']) body {
				background-color: #050a1a;
				color: #e2e8f5;
			}
		</style>
	</head>

	<body>
		<app-root>Chargement...</app-root>
	</body>
</html>
